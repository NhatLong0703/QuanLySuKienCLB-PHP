<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - CLB Event</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .auth-card { background: white; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .auth-card h2 { text-align: center; margin-bottom: 25px; color: #1a1a2e; font-size: 28px; }
        .auth-card label { font-weight: bold; color: #555; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .auth-card input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        .btn-auth { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        .btn-auth:hover { background: #0056b3; }
        .auth-links { text-align: center; margin-top: 20px; font-size: 14px; }
        .auth-links a { color: #007bff; text-decoration: none; font-weight: bold; }
        .auth-links a:hover { text-decoration: underline; }
        .alert { display: none; padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; text-align: center; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2>👋 Đăng nhập</h2>
    <div id="errorMsg" class="alert alert-error"></div>
    <form id="loginForm" onsubmit="doLogin(event)">
        <label>Email của bạn</label>
        <input type="email" id="email" placeholder="VD: sv@domain.com" required>
        
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••••" required>
        
        <button type="submit" class="btn-auth" id="btnSubmit">Vào hệ thống</button>
    </form>
    
    <div style="text-align: center; margin: 20px 0; position: relative;">
        <hr style="border: 0; border-top: 1px solid #ddd;">
        <span style="background: white; padding: 0 10px; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: #888; font-size: 13px;">HOẶC ĐĂNG NHẬP VỚI</span>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/api/auth/google" class="btn-auth" style="background: white; color: #444; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; text-decoration: none;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" style="margin-right: 10px;"> Đăng nhập bằng Google
        </a>
        <a href="/api/auth/microsoft" class="btn-auth" style="background: white; color: #444; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; text-decoration: none;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" width="20" style="margin-right: 10px;"> Đăng nhập bằng Microsoft
        </a>
        <a href="/api/auth/github" class="btn-auth" style="background: #24292e; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" width="20" style="margin-right: 10px; filter: invert(1);"> Đăng nhập bằng Github
        </a>
    </div>

    <div class="auth-links">
        Chưa có tài khoản? <a href="/views/auth/register.html">Đăng ký ngay</a><br>
        <a href="/" style="display:inline-block; margin-top: 15px; color:#666; font-weight:normal;">&larr; Về trang chủ</a>
    </div>
</div>

<script src="/assets/js/api.js"></script>
<script>
if(getUser()){
    const r=getUser().role;
    window.location.href = r==='admin' ? '/views/admin/dashboard.html' : (r==='organizer' ? '/views/organizer/dashboard.html' : '/views/member/events.html');
}

async function doLogin(e){
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const msg = document.getElementById('errorMsg');
  
  btn.innerText = 'Đang xử lý...'; btn.disabled = true;
  msg.style.display = 'none';

  try{
    const res = await apiCall('/user/login','POST',{email:document.getElementById('email').value,password:document.getElementById('password').value});
    localStorage.setItem('user',JSON.stringify(res.data));
    const r = res.data.role;
    window.location.href = r==='admin' ? '/views/admin/dashboard.html' : (r==='organizer' ? '/views/organizer/dashboard.html' : '/views/member/events.html');
  }catch(err){
      msg.innerText = err.message;
      msg.style.display = 'block';
  }finally{
      btn.innerText = 'Vào hệ thống'; btn.disabled = false;
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Events - ClubHub Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; display: flex; min-height: 100vh; color: #1F2937; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background-color: #0F172A; color: #9CA3AF; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 24px; color: white; padding: 0 20px 20px; border-bottom: 1px solid #1E293B; margin-bottom: 20px; }
        .sidebar-brand span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: normal; letter-spacing: 2px; margin-top: 4px; color: #64748B; text-transform: uppercase; }
        .sidebar-menu-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 20px 10px; color: #475569; }
        .sidebar-menu a { display: flex; align-items: center; padding: 12px 20px; color: #9CA3AF; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .sidebar-menu a:hover { color: white; }
        .sidebar-menu a.active { background-color: #F59E0B; color: white; font-weight: 500; border-radius: 4px; margin: 0 10px; padding: 12px 10px; width: calc(100% - 20px); }
        .sidebar-user { margin-top: auto; padding: 20px; border-top: 1px solid #1E293B; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #10B981; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .user-info { font-size: 14px; color: white; }
        .user-info span { display: block; font-size: 11px; color: #64748B; text-transform: uppercase; margin-top: 2px; }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: #111827; margin-bottom: 8px; }
        .header p { color: #6B7280; font-size: 14px; }

        /* Action Bar */
        .action-bar { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #111827; color: white; }
        .btn-primary:hover { background: #374151; }
        .btn-outline { background: white; border: 1px solid #E5E7EB; color: #374151; }
        .btn-outline:hover { background: #F9FAFB; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 16px; border: 1px solid #E5E7EB; background: white; border-radius: 6px; font-size: 14px; cursor: pointer; color: #4B5563; font-family: inherit; font-weight: 500; transition: all 0.2s; }
        .tab-btn.active { background: #F59E0B; color: white; border-color: #F59E0B; }
        .tab-btn:hover:not(.active) { background: #F9FAFB; }

        /* Table Area */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #F3F4F6; overflow: hidden; overflow-x: auto;}
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9CA3AF; padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-weight: 500; }
        td { padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-size: 14px; color: #374151; vertical-align: middle; }
        tr:hover { background-color: #F9FAFB; }
        
        .event-title { font-weight: 500; color: #111827; }
        .event-meta { font-size: 12px; color: #9CA3AF; margin-top: 4px; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        .badge-upcoming { background-color: #DBEAFE; color: #1E40AF; }
        .badge-upcoming::before { background: #3B82F6; }
        .badge-completed { background-color: #F3F4F6; color: #4B5563; }
        .badge-completed::before { background: #6B7280; }
        .badge-cancelled { background-color: #FEE2E2; color: #991B1B; }
        .badge-cancelled::before { background: #EF4444; }

        .progress-wrapper { display: flex; align-items: center; gap: 10px; }
        .progress-bar-bg { width: 80px; height: 4px; background: #E5E7EB; border-radius: 2px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 2px; }
        .capacity-text { font-size: 13px; font-weight: 500; min-width: 45px; text-align: right; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; border-radius: 12px; width: 500px; max-width: 90%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-header h2 { font-family: 'Playfair Display', serif; font-size: 20px; color: #111827; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6B7280; }
        .modal-body { padding: 24px; overflow-y: auto; }
        .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
        .form-col { flex: 1; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; }
        .form-control:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #E5E7EB; display: flex; justify-content: flex-end; gap: 12px; background: #F9FAFB; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; flex-shrink: 0;}
    </style>
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/io.js"></script>
    <script>requireLogin(); requireRole("organizer");</script>

    <div class="sidebar">
        <div class="sidebar-brand">
            ClubHub
            <span>Management System</span>
        </div>
        <div class="sidebar-menu-title">Navigation</div>
        <div class="sidebar-menu">
            <a href="/views/organizer/dashboard.html">○ Dashboard</a>
            <a href="/views/organizer/clubs.html">◈ Clubs</a>
            <a href="/views/organizer/events.html" class="active">● Events</a>
            <a href="/views/organizer/registrations.html">◫ Registrations</a>
            <a href="/views/organizer/attendance.html">✓ Attendance</a>
            <a href="/views/organizer/notifications.html">⊙ Notifications</a>
            </div>
        <div class="sidebar-user" id="sidebarUser"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Events</h1>
                <p id="totalCount">Loading...</p>
            </div>
            <div class="action-bar">
                <input type="file" id="csvImport" accept=".csv" style="display:none" onchange="handleImport(event)">
                <button class="btn btn-outline" onclick="document.getElementById('csvImport').click()">📥 Import CSV</button>
                <button class="btn btn-outline" onclick="exportData('excel')">📊 Export Excel</button>
                <button class="btn btn-outline" onclick="exportToPDF()">📄 Export PDF</button>
                <button class="btn btn-primary" onclick="openModal()">+ Add New</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
            <button class="tab-btn" onclick="setFilter('upcoming', this)">Upcoming</button>
            <button class="tab-btn" onclick="setFilter('completed', this)">Completed</button>
            <button class="tab-btn" onclick="setFilter('cancelled', this)">Cancelled</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Club</th>
                        <th>Location</th>
                        <th>Date & Time</th>
                        <th>Capacity</th>
                        <th>Status</th>
                        <th style="text-align:right">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- CRUD Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Event</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="eventForm" onsubmit="saveEvent(event)">
                    <input type="hidden" id="eventId">
                    
                    <div class="form-group">
                        <label>Event Title</label>
                        <input type="text" id="evTitle" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Club</label>
                        <select id="evClub" class="form-control" required>
                            <!-- populated by JS -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="evLocation" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Event Image</label>
                        <input type="file" id="evImage" class="form-control" accept="image/*">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <label>Start Time</label>
                            <input type="datetime-local" id="evStart" class="form-control" required>
                        </div>
                        <div class="form-col">
                            <label>End Time</label>
                            <input type="datetime-local" id="evEnd" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-col">
                            <label>Capacity</label>
                            <input type="number" id="evCapacity" class="form-control" min="1" required>
                        </div>
                        <div class="form-col">
                            <label>Deadline</label>
                            <input type="datetime-local" id="evDeadline" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Status</label>
                        <select id="evStatus" class="form-control">
                            <option value="draft">Draft</option>
                            <option value="open">Open (Upcoming)</option>
                            <option value="closed">Closed (Completed)</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" form="eventForm">Save Event</button>
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let uniqueClubsCount = 0;
        let currentFilter = 'all';
        let clubsList = [];

        async function init() {
            const u = getUser();
            if(u) {
                const initials = u.full_name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
                document.getElementById('sidebarUser').innerHTML = `
                    <div class="avatar">${initials}</div>
                    <div class="user-info">${u.full_name}<span>Administrator</span></div>
                `;
            }
            await loadData();
            
            // load clubs for select dropdown
            try {
                const cres = await apiCall('/club/index?limit=-1');
                clubsList = cres.data.data;
                const select = document.getElementById('evClub');
                select.innerHTML = '<option value="">-- Select Club --</option>' + clubsList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch(e) {}
        }

        async function loadData() {
            try {
                const res = await apiCall('/event/index?limit=-1');
                allEvents = res.data.data;
                
                const uniqueClubs = [...new Set(allEvents.map(e => e.club_id))];
                uniqueClubsCount = uniqueClubs.length;
                
                document.getElementById('totalCount').innerText = `${allEvents.length} total events across ${uniqueClubsCount} clubs`;
                
                renderTable();
            } catch (e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Error: ${e.message}</td></tr>`;
            }
        }

        function setFilter(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function getProgressBarColor(percent) {
            if(percent >= 100) return '#EF4444'; // Red
            if(percent >= 80) return '#F59E0B'; // Yellow
            return '#10B981'; // Green
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            const mappedData = allEvents.map(e => {
                let status = 'upcoming';
                const now = new Date();
                const end = new Date(e.end_time);
                if (e.status === 'cancelled') status = 'cancelled';
                else if (end < now || e.status === 'closed') status = 'completed';
                return { ...e, ui_status: status };
            });

            const filteredData = currentFilter === 'all' ? mappedData : mappedData.filter(d => d.ui_status === currentFilter);
            
            if(filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px 0; color: #9CA3AF;">No events found.</td></tr>';
                return;
            }

            let html = '';
            filteredData.forEach(item => {
                const startDate = new Date(item.start_time);
                const endDate = new Date(item.end_time);
                
                const dateStr = startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const startTimeStr = startDate.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });
                const endTimeStr = endDate.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });
                
                const deadlineDate = new Date(item.registration_deadline);
                const deadlineStr = deadlineDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                let badgeClass = 'badge-upcoming';
                if(item.ui_status === 'completed') badgeClass = 'badge-completed';
                if(item.ui_status === 'cancelled') badgeClass = 'badge-cancelled';
                
                const registered = item.capacity - item.slots_left;
                const percent = item.capacity > 0 ? Math.min(100, Math.round((registered / item.capacity) * 100)) : 0;
                const barColor = getProgressBarColor(percent);

                html += `
                <tr>
                    <td>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:48px; height:48px; border-radius:8px; background-color:#F3F4F6; background-image:url('${item.image || ''}'); background-size:cover; background-position:center; flex-shrink:0;"></div>
                            <div>
                                <div class="event-title">${item.title}</div>
                                <div class="event-meta">Deadline: ${deadlineStr}</div>
                            </div>
                        </div>
                    </td>
                    <td>${item.club_name || '<span style="color:#9CA3AF">System</span>'}</td>
                    <td>${item.location}</td>
                    <td>
                        <div style="font-weight:500;">${dateStr}, ${startTimeStr}</div>
                        <div class="event-meta">- ${endTimeStr}</div>
                    </td>
                    <td>
                        <div class="progress-wrapper">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${percent}%; background-color: ${barColor}"></div>
                            </div>
                            <span class="capacity-text">${registered}/${item.capacity}</span>
                        </div>
                    </td>
                    <td><span class="badge ${badgeClass}">${item.ui_status}</span></td>
                    <td style="text-align:right">
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" onclick="viewFeedback(${item.id})">⭐</button>
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" onclick="openModal(${item.id})">✏️</button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteEvent(${item.id})">🗑️</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
            if(typeof applyI18n === 'function') applyI18n();
        }

        // FORMAT HELPER FOR DATETIME-LOCAL INPUT
        function toDateTimeLocal(dateStr) {
            const date = new Date(dateStr);
            const pad = n => n < 10 ? '0' + n : n;
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        // CRUD Logic
        function openModal(id = null) {
            document.getElementById('eventModal').style.display = 'flex';
            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Event';
                const item = allEvents.find(c => c.id === id);
                document.getElementById('eventId').value = item.id;
                document.getElementById('evTitle').value = item.title;
                document.getElementById('evClub').value = item.club_id;
                document.getElementById('evLocation').value = item.location;
                document.getElementById('evStart').value = toDateTimeLocal(item.start_time);
                document.getElementById('evEnd').value = toDateTimeLocal(item.end_time);
                document.getElementById('evCapacity').value = item.capacity;
                document.getElementById('evDeadline').value = toDateTimeLocal(item.registration_deadline);
                document.getElementById('evStatus').value = item.status;
            } else {
                document.getElementById('modalTitle').innerText = 'Add New Event';
                document.getElementById('eventForm').reset();
                document.getElementById('eventId').value = '';
                
                // defaults
                const now = new Date();
                const defaultTime = toDateTimeLocal(now);
                document.getElementById('evStart').value = defaultTime;
                document.getElementById('evEnd').value = defaultTime;
                document.getElementById('evDeadline').value = defaultTime;
            }
            if(typeof applyI18n === 'function') applyI18n();
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').style.display = 'none';
        }

        async function viewFeedback(eventId) {
            try {
                const res = await apiCall(`/feedback/list?event_id=${eventId}`);
                const stats = res.data.stats;
                const feedbacks = res.data.feedbacks;
                
                document.getElementById('fbAvgRating').innerText = stats.avg_rating ? parseFloat(stats.avg_rating).toFixed(1) : '0.0';
                document.getElementById('fbTotalCount').innerText = `${stats.total_feedbacks} ratings`;
                
                let fbHtml = '';
                if(feedbacks.length === 0) {
                    fbHtml = '<div style="text-align:center; color:#9CA3AF; padding:20px;">No feedback yet.</div>';
                } else {
                    feedbacks.forEach(f => {
                        const stars = '★'.repeat(f.rating) + '☆'.repeat(5-f.rating);
                        fbHtml += `
                        <div style="background:#F9FAFB; padding:12px; border-radius:6px; border:1px solid #E5E7EB;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                <strong style="font-size:14px;">${f.user_name}</strong>
                                <span style="color:#F59E0B; font-size:14px;">${stars}</span>
                            </div>
                            <div style="font-size:14px; color:#4B5563;">${f.comment || '<i>No comment</i>'}</div>
                            <div style="font-size:11px; color:#9CA3AF; margin-top:6px;">${new Date(f.created_at).toLocaleString()}</div>
                        </div>`;
                    });
                }
                document.getElementById('fbList').innerHTML = fbHtml;
                document.getElementById('feedbackModal').style.display = 'flex';
                if(typeof applyI18n === 'function') applyI18n();
            } catch(e) {
                alert('Error loading feedback: ' + e.message);
            }
        }

        async function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            
            // Format back to DB datetime
            const formatDT = val => val.replace('T', ' ') + ':00';

            const data = new FormData();
            data.append('title', document.getElementById('evTitle').value);
            data.append('club_id', document.getElementById('evClub').value);
            data.append('location', document.getElementById('evLocation').value);
            data.append('start_time', formatDT(document.getElementById('evStart').value));
            data.append('end_time', formatDT(document.getElementById('evEnd').value));
            data.append('capacity', document.getElementById('evCapacity').value);
            data.append('registration_deadline', formatDT(document.getElementById('evDeadline').value));
            data.append('status', document.getElementById('evStatus').value);

            const fileInput = document.getElementById('evImage');
            if (fileInput.files.length > 0) {
                data.append('image', fileInput.files[0]);
            }

            try {
                if (id) {
                    await apiCall('/event/update?id=' + id, 'POST', data);
                    alert('Updated successfully');
                } else {
                    await apiCall('/event/create', 'POST', data);
                    alert('Created successfully');
                }
                closeModal();
                loadData();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deleteEvent(id) {
            if(!confirm('Are you sure you want to delete this event?')) return;
            try {
                await apiCall('/event/delete?id=' + id, 'DELETE');
                alert('Deleted successfully');
                loadData();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // Export/Import
        function exportData(type) {
            if (type === 'excel') {
                exportToCSV(allEvents, 'events_export');
            }
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            importCSV(file, async (data) => {
                let success = 0;
                for (let row of data) {
                    try {
                        if (row.title && row.club_id && row.start_time && row.end_time && row.capacity && row.registration_deadline) {
                            await apiCall('/event/create', 'POST', row);
                            success++;
                        }
                    } catch(err) { console.error(err); }
                }
                alert(`Imported ${success} events successfully!`);
                loadData();
                e.target.value = ''; // reset
            });
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tham gia - Organizer</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- SheetJS for Excel Export/Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF and AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<script src="/assets/js/api.js"></script>
<script>requireLogin();</script>

<div class="container" style="margin-top:80px; max-width: 1000px;">
    <a href="/views/organizer/dashboard.html" class="btn btn-primary" style="margin-bottom:16px;">&larr; Quay lại</a>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 id="pageTitle" style="margin: 0;">Danh sách tham gia</h2>
        <div>
            <button class="btn btn-success" onclick="exportExcel()">⬇️ Xuất Excel</button>
            <button class="btn btn-danger" onclick="exportPDF()">⬇️ Xuất PDF</button>
            <button class="btn btn-warning" onclick="document.getElementById('importExcel').click()">⬆️ Nhập Excel</button>
            <input type="file" id="importExcel" accept=".xlsx, .xls" style="display: none;" onchange="importExcel(event)">
        </div>
    </div>
    
    <div id="participantList"></div>
</div>

<script>
setupNavbar();
const eventId = new URLSearchParams(location.search).get('event_id');
let participantsData = [];

async function load() {
    try {
        const res = await apiCall(`/registration/byEvent?event_id=${eventId}`);
        participantsData = res.data;
        const el = document.getElementById('participantList');
        if(!res.data.length) {
            el.innerHTML = '<p>Chưa có ai đăng ký.</p>';
            return;
        }
        let html = '<table id="participantsTable"><tr><th>#</th><th>Họ và Tên</th><th>Email</th><th>SĐT</th><th>Trạng thái</th><th>Ngày ĐK</th></tr>';
        res.data.forEach((r, i) => {
            html += `<tr>
                <td>${i+1}</td>
                <td>${r.full_name}</td>
                <td>${r.email}</td>
                <td>${r.phone || ''}</td>
                <td><span class="badge badge-${r.status}">${r.status}</span></td>
                <td>${r.registered_at}</td>
            </tr>`;
        });
        el.innerHTML = html + '</table>';
    } catch(e) {
        alert(e.message);
    }
}
load();

function exportExcel() {
    if (participantsData.length === 0) return alert('Không có dữ liệu để xuất!');
    const data = participantsData.map((r, i) => ({
        STT: i + 1,
        'Họ và Tên': r.full_name,
        'Email': r.email,
        'Số điện thoại': r.phone || '',
        'Trạng thái': r.status,
        'Ngày đăng ký': r.registered_at
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "DanhSach");
    XLSX.writeFile(wb, "DanhSachThamGia.xlsx");
}

function exportPDF() {
    if (participantsData.length === 0) return alert('Không có dữ liệu để xuất!');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Danh Sach Tham Gia", 14, 15);
    
    const bodyData = participantsData.map((r, i) => [
        i + 1,
        r.full_name,
        r.email,
        r.phone || '',
        r.status,
        r.registered_at
    ]);

    doc.autoTable({
        head: [['STT', 'Ho va Ten', 'Email', 'SDT', 'Trang thai', 'Ngay DK']],
        body: bodyData,
        startY: 20,
    });
    doc.save('DanhSachThamGia.pdf');
}

async function importExcel(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet);
        
        if (rows.length === 0) return alert('File rỗng!');
        if (!confirm(`Bạn có chắc muốn import ${rows.length} thành viên không? (Yêu cầu file có cột Email)`)) return;
        
        let success = 0;
        let fail = 0;
        
        // This is a naive import that registers existing users based on Email, or creates them.
        // For simplicity, we'll call an API endpoint if it exists, or show an alert that bulk import needs backend support.
        alert('Tính năng Import Excel đang gọi API ảo. Cần viết thêm API /registration/bulk trên backend để xử lý!');
    };
    reader.readAsArrayBuffer(file);
    e.target.value = ''; // reset file input
}
</script>
</body>
</html>

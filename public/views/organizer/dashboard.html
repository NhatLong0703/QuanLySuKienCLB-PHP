<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Organizer Dashboard - ClubHub</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400..1000;1,400..1000&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background-color: #f0ebe0; display: flex; min-height: 100vh; color: #1a1a1a; }
        
        /* Sidebar Styling */
        .sidebar { width: 228px; background-color: #0d0f1a; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
        .sidebar-brand-box { padding: 28px 24px 22px; }
        .sidebar-brand { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; line-height: 1.1; }
        .sidebar-brand span { display: block; font-size: 10px; letter-spacing: 0.12em; color: #6b7280; margin-top: 3px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }
        .sidebar-nav { flex: 1; padding: 0 12px; overflow-y: auto; }
        .sidebar-menu-title { font-size: 10px; letter-spacing: 0.12em; color: #4b5563; padding: 0 12px; margin-bottom: 10px; text-transform: uppercase; }
        .sidebar-menu a { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 14px; border-radius: 8px; text-decoration: none; margin-bottom: 2px; color: #9ca3af; font-size: 14px; transition: all 0.15s; }
        .sidebar-menu a:hover { background-color: rgba(255,255,255,0.05); }
        .sidebar-menu a.active { background-color: #e07a2a; color: #fff; font-weight: 600; }
        .sidebar-menu a.active .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background-color: #fff; opacity: 0.7; }
        .sidebar-menu a .icon { font-size: 12px; opacity: 0.7; }
        .sidebar-user { padding: 16px 24px; border-top: 1px solid #1e2030; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 34px; height: 34px; border-radius: 50%; background: #b45309; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .user-info { font-size: 13px; font-weight: 600; color: #fff; }
        .user-info span { display: block; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; font-weight: normal; }

        /* Main Content */
        .main-content { flex: 1; padding: 36px 40px; overflow-y: auto; }
        .header { margin-bottom: 28px; }
        .header h1 { font-family: 'DM Serif Display', serif; font-size: 38px; color: #1a1a1a; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
        .header p { color: #7a7060; font-size: 14px; margin-top: 6px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 14px; margin-bottom: 28px; }
        .stat-card { border-radius: 14px; padding: 28px 24px; background: #fff; border: 1px solid #e5e0d5; }
        .stat-card.dark { background: #0d0f1a; color: #fff; border: none; padding-bottom: 24px; }
        .stat-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; display: block; }
        .stat-card.dark .stat-title { color: #6b7280; }
        .stat-card:not(.dark) .stat-title { color: #7a7060; }
        .stat-value { font-family: 'DM Serif Display', serif; font-size: 56px; line-height: 1; }
        .stat-card:not(.dark) .stat-value { color: #1a1a1a; }
        .stat-desc { font-size: 12px; color: #7a7060; margin-top: 8px; }

        /* Charts Rows */
        .chart-row-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
        .chart-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
        .chart-card { background: #fff; border-radius: 14px; border: 1px solid #e5e0d5; padding: 22px 24px; }
        .chart-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .chart-subtitle { font-size: 12px; color: #7a7060; margin-bottom: 18px; }
        .chart-container { position: relative; height: 200px; width: 100%; }

        /* Table Section */
        .table-section { background: #fff; border-radius: 14px; border: 1px solid #e5e0d5; overflow: hidden; }
        .table-header { padding: 18px 24px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e0d5; }
        .table-title { font-weight: 600; font-size: 15px; }
        .btn-create { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; background: #e07a2a; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; }
        .btn-create:hover { background: #c06018; }
        
        .list-row { display: grid; grid-template-columns: 80px 1fr 120px 140px 100px; padding: 12px 24px; border-bottom: 1px solid #f0ebe0; align-items: center; gap: 10px; }
        .list-row:last-child { border-bottom: none; }
        .list-header-row { padding: 12px 24px; border-bottom: 1px solid #e5e0d5; font-size: 11px; letter-spacing: 0.1em; color: #7a7060; text-transform: uppercase; display: grid; grid-template-columns: 80px 1fr 120px 140px 100px; gap: 10px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; text-transform: capitalize; }
        .badge.active { background: #dcfce7; color: #15803d; }
        .badge.draft { background: #fef9c3; color: #a16207; }
        .badge.closed { background: #fee2e2; color: #b91c1c; }
        
        .img-placeholder { width: 80px; height: 50px; background: #e5e0d5; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script>requireLogin(); requireRole("organizer");</script>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand-box">
            <div class="sidebar-brand">ClubHub<span>Management System</span></div>
        </div>
        <nav class="sidebar-nav sidebar-menu">
            <div class="sidebar-menu-title">Navigation</div>
            <a href="/views/organizer/dashboard.html" class="active"><span class="icon">◎</span> Dashboard<div class="dot"></div></a>
            <a href="/views/organizer/clubs.html"><span class="icon">◆</span> Clubs</a>
            <a href="/views/organizer/events.html"><span class="icon">◎</span> Events</a>
            <a href="/views/organizer/registrations.html"><span class="icon">▣</span> Registrations</a>
            <a href="/views/organizer/attendance.html"><span class="icon">✓</span> Attendance</a>
        </nav>
        <div class="sidebar-user" id="sidebarUser"></div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
            <p>Overview of all clubs and events</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card dark">
                <span class="stat-title">Total Bookings</span>
                <div class="stat-value" id="statBooked">0</div>
            </div>
            <div class="stat-card">
                <span class="stat-title">Active Listings</span>
                <div class="stat-value" id="statActive">0</div>
            </div>
            <div class="stat-card">
                <span class="stat-title">Revenue</span>
                <div class="stat-value" id="statRev" style="font-size:42px;">$0</div>
                <div class="stat-desc">from paid listings</div>
            </div>
        </div>

        <!-- Listings Table -->
        <div class="table-section">
            <div class="table-header">
                <span class="table-title">All Listings</span>
            </div>
            <div class="list-header-row">
                <div>Image</div>
                <div>Title / Category</div>
                <div>Status</div>
                <div>Progress</div>
                <div>Price</div>
            </div>
            <div id="listingsTableBody">
                <p style="padding: 20px; text-align: center; color: #7a7060;">Loading...</p>
            </div>
            <div id="paginationControls" style="padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e5e0d5;">
            </div>
        </div>
    </main>

    <script>
        // Colors from Figma mockup
        const C = { orange: '#e07a2a', violet: '#6d28d9', blue: '#0369a1', green: '#15803d', bg: '#f0ebe0', text: '#7a7060' };

        let allClubs = [];
        let allEvents = [];
        let allRegs = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        async function init() {
            const u = getUser();
            if(u) {
                const initials = u.full_name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
                document.getElementById('sidebarUser').innerHTML = `
                    <div class="avatar">${initials}</div>
                    <div>
                        <div class="user-info">${u.full_name}</div>
                        <div style="font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;">${u.role}</div>
                    </div>
                `;
            }

            try {
                // Fetch actual data
                const [clubsRes, eventsRes, regsRes] = await Promise.all([
                    apiCall('/club/index?limit=-1'),
                    apiCall('/event/index?limit=-1'),
                    apiCall('/registration/all')
                ]);

                allClubs = clubsRes.data.data;
                allEvents = eventsRes.data.data || [];
                allRegs = regsRes.data || [];

                calculateAndRenderStats();
                loadPage(1);
            } catch (err) {
                console.error(err);
                alert("Lỗi tải dữ liệu. Bạn hãy F5 lại trang.");
            }
        }

        function calculateAndRenderStats() {
            const activeClubs = allClubs.filter(c => c.status === 'active').length;
            const activeEvents = allEvents.filter(e => e.status === 'open').length;
            const totalBooked = allRegs.length; // Approximate total bookings
            
            // For revenue, approximate based on some data or fake it if no real price column exists
            // In ClubHub, events might not have a price column yet. Let's show a simulated revenue based on bookings * 15
            const revenue = totalBooked * 15; 

            document.getElementById('statActive').innerText = activeClubs + activeEvents;
            document.getElementById('statBooked').innerText = totalBooked;
            document.getElementById('statRev').innerText = "$" + revenue.toLocaleString();
        }

        async function loadPage(page) {
            currentPage = page;
            const tbody = document.getElementById('listingsTableBody');
            const pagination = document.getElementById('paginationControls');
            
            tbody.innerHTML = '<p style="padding: 20px; text-align: center; color: #7a7060;">Loading...</p>';

            try {
                const res = await apiCall(`/dashboard/listings?page=${page}&limit=${itemsPerPage}`);
                if (res.status === 'success') {
                    renderTable(res.data);
                } else {
                    tbody.innerHTML = '<p style="padding: 20px; text-align: center; color: red;">Failed to load listings.</p>';
                }
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<p style="padding: 20px; text-align: center; color: red;">Network error.</p>';
            }
        }

        function renderTable(pageData) {
            const tbody = document.getElementById('listingsTableBody');
            const pagination = document.getElementById('paginationControls');
            
            const currentListings = pageData.data;

            if(currentListings.length === 0) {
                tbody.innerHTML = '<p style="padding: 20px; text-align: center; color: #7a7060;">No listings available.</p>';
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            currentListings.forEach(l => {
                let badgeClass = l.status === 'active' || l.status === 'open' ? 'active' : (l.status === 'closed' ? 'closed' : 'draft');
                let imgHtml = l.img ? `<img src="${l.img}" style="width:80px; height:50px; object-fit:cover; border-radius:6px;">` : `<div class="img-placeholder"></div>`;
                
                let pct = l.total > 0 ? Math.round((l.booked/l.total)*100) : 0;

                html += `<div class="list-row">
                    <div>${imgHtml}</div>
                    <div>
                        <div style="font-weight:600; font-size:14px; color:#1a1a1a;">${l.title}</div>
                        <div style="font-size:12px; color:#7a7060; margin-top:2px;">${l.cat}</div>
                    </div>
                    <div><span class="badge ${badgeClass}">${l.status}</span></div>
                    <div>
                        <div style="font-size:12px; color:#7a7060; margin-bottom:4px; display:flex; justify-content:space-between;"><span>${l.booked}/${l.total} spots</span><span>${pct}%</span></div>
                        <div style="width:100%; height:4px; background:#f0ebe0; border-radius:2px;"><div style="width:${pct}%; height:100%; background:${pct>=100?C.green:C.violet}; border-radius:2px;"></div></div>
                    </div>
                    <div style="font-size:14px; color:#1a1a1a;">${l.price > 0 ? '$'+l.price : 'Free'}</div>
                </div>`;
            });
            tbody.innerHTML = html;

            const totalPages = pageData.total_pages;
            const startIndex = (pageData.page - 1) * pageData.limit;

            // Render pagination controls
            pagination.innerHTML = `
                <div style="font-size: 13px; color: #7a7060;">
                    Showing ${startIndex + 1} to ${Math.min(startIndex + pageData.limit, pageData.total)} of ${pageData.total}
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="changePage(-1)" ${pageData.page === 1 ? 'disabled' : ''} style="padding: 6px 12px; border: 1px solid #e5e0d5; background: ${pageData.page === 1 ? '#f9f8f6' : '#fff'}; color: ${pageData.page === 1 ? '#b0a89a' : '#1a1a1a'}; border-radius: 6px; cursor: ${pageData.page === 1 ? 'not-allowed' : 'pointer'};">Previous</button>
                    <button onclick="changePage(1)" ${pageData.page === totalPages ? 'disabled' : ''} style="padding: 6px 12px; border: 1px solid #e5e0d5; background: ${pageData.page === totalPages ? '#f9f8f6' : '#fff'}; color: ${pageData.page === totalPages ? '#b0a89a' : '#1a1a1a'}; border-radius: 6px; cursor: ${pageData.page === totalPages ? 'not-allowed' : 'pointer'};">Next</button>
                </div>
            `;
        }

        function changePage(delta) {
            loadPage(currentPage + delta);
        }

        init();
    </script>
</body>
</html>

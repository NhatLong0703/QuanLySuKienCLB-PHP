<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><title>Thong ke - Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
<script src="/assets/js/api.js"></script>
<script>requireLogin(); requireRole("admin");</script>
<div class="container" style="margin-top:80px;">
  <a href="/views/admin/dashboard.html" class="btn btn-primary" style="margin-bottom:16px;">&larr; Dashboard</a>
  <h2>Thong ke he thong</h2>
  <div style="display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;">
    <div class="card" style="flex:1;min-width:200px;text-align:center;">
      <h3 style="color:#555;font-size:16px;">Tổng Người Dùng</h3>
      <div id="stat_users" style="font-size:36px;font-weight:bold;color:#007bff;margin-top:10px;">0</div>
    </div>
    <div class="card" style="flex:1;min-width:200px;text-align:center;">
      <h3 style="color:#555;font-size:16px;">Tổng Câu Lạc Bộ</h3>
      <div id="stat_clubs" style="font-size:36px;font-weight:bold;color:#28a745;margin-top:10px;">0</div>
    </div>
    <div class="card" style="flex:1;min-width:200px;text-align:center;">
      <h3 style="color:#555;font-size:16px;">Tổng Sự Kiện</h3>
      <div id="stat_events" style="font-size:36px;font-weight:bold;color:#ffc107;margin-top:10px;">0</div>
    </div>
    <div class="card" style="flex:1;min-width:200px;text-align:center;">
      <h3 style="color:#555;font-size:16px;">Lượt Đăng Ký</h3>
      <div id="stat_regs" style="font-size:36px;font-weight:bold;color:#dc3545;margin-top:10px;">0</div>
    </div>
  </div>
  <h3 style="margin-top:30px;margin-bottom:15px;">Sự kiện gần đây</h3>
  <div id="recentEventsList"></div>
</div>
<script>
setupNavbar();
async function loadStats(){
  try{
    const res = await apiCall('/statistics/admin');
    const overview = res.data.overview;
    document.getElementById('stat_users').innerText = overview.total_users;
    document.getElementById('stat_clubs').innerText = overview.total_clubs;
    document.getElementById('stat_events').innerText = overview.total_events;
    document.getElementById('stat_regs').innerText = overview.total_registrations;
    
    let html='<table><tr><th>Sự kiện</th><th>Đăng ký</th><th>Sức chứa</th><th>Tỷ lệ lấp đầy</th></tr>';
    res.data.recent_events.forEach(ev=>{
        let percent = (ev.registered_count / ev.capacity * 100).toFixed(1);
        html+=`<tr><td>${ev.title}</td><td>${ev.registered_count}</td><td>${ev.capacity}</td><td>
            <div style="width:100%;background:#e0e0e0;border-radius:4px;height:8px;overflow:hidden;margin-top:6px;">
                <div style="width:${percent}%;background:${percent>80?'#dc3545':'#28a745'};height:100%;"></div>
            </div>
            <span style="font-size:12px;">${percent}%</span>
        </td></tr>`;
    });
    document.getElementById('recentEventsList').innerHTML=html+'</table>';
  }catch(e){alert(e.message);}
}
loadStats();
</script>
</body></html>

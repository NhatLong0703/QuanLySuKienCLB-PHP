<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><title>Dashboard - Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
<script src="/assets/js/api.js"></script>
<script>requireLogin(); requireRole("admin");</script>
<div class="container" style="margin-top:80px;">
  <h2>Dashboard Admin</h2>
  <div style="display:flex;gap:12px;margin:16px 0;">
    <button class="btn btn-primary" onclick="showSection('users')">Quan ly Users</button>
    <button class="btn btn-success" onclick="showSection('clubs')">Quan ly CLB</button>
    <button class="btn btn-warning" onclick="showSection('import')">Import Users CSV</button>
  </div>
  <div id="section_users" class="section">
    <h3>Danh sach Nguoi dung</h3>
    <div id="userList"></div>
  </div>
  <div id="section_clubs" class="section" style="display:none;">
    <h3>Danh sach CLB</h3>
    <div id="clubList"></div>
  </div>
  <div id="section_import" class="section" style="display:none;">
    <div class="card" style="max-width:500px;">
      <h3>Import Tai khoan tu CSV</h3>
      <p style="font-size:13px;color:#666;margin-bottom:12px;">Dinh dang: full_name, email, password, role, phone</p>
      <input type="file" id="csvFile" accept=".csv">
      <button class="btn btn-primary" style="margin-top:8px;" onclick="importUsers()">Import</button>
      <div id="importResult" style="margin-top:12px;"></div>
    </div>
  </div>
</div>
<script>
setupNavbar();
function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById('section_'+name).style.display='block';
  if(name==='users') loadUsers();
  if(name==='clubs') loadClubs();
}
async function loadUsers(){
  try{
    const res=await apiCall('/user/list');
    const el=document.getElementById('userList'); el.innerHTML='';
    let html='<table><tr><th>ID</th><th>Ten</th><th>Email</th><th>Role</th><th>Trang thai</th><th>Thao tac</th></tr>';
    res.data.forEach(u=>html+=`<tr><td>${u.id}</td><td>${u.full_name}</td><td>${u.email}</td><td>${u.role}</td><td><span class="badge badge-${u.status==="active"?"open":"closed"}">${u.status}</span></td>
      <td>${u.status==="active"?`<button class="btn btn-danger" style="padding:3px 10px;" onclick="lockUser(${u.id})">Khoa</button>`:`<button class="btn btn-success" style="padding:3px 10px;" onclick="unlockUser(${u.id})">Mo khoa</button>`}</td></tr>`);
    el.innerHTML=html+'</table>';
  }catch(e){alert(e.message);}
}
async function lockUser(id){ await apiCall(`/user/lock?id=${id}`,'PUT'); loadUsers(); }
async function unlockUser(id){ await apiCall(`/user/unlock?id=${id}`,'PUT'); loadUsers(); }
async function loadClubs(){
  try{
    const res=await apiCall('/club/index');
    const el=document.getElementById('clubList'); el.innerHTML='';
    let html='<table><tr><th>ID</th><th>Ten</th><th>Mo ta</th><th>Trang thai</th></tr>';
    res.data.forEach(c=>html+=`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.description||''}</td><td>${c.status}</td></tr>`);
    el.innerHTML=html+'</table>';
  }catch(e){alert(e.message);}
}
async function importUsers(){
  const file=document.getElementById('csvFile').files[0];
  if(!file){alert('Vui long chon file CSV');return;}
  const fd=new FormData(); fd.append('file',file);
  try{
    const res=await fetch('/api/import/users',{method:'POST',body:fd});
    const data=await res.json();
    const el=document.getElementById('importResult');
    el.innerHTML=`<div class="alert alert-success">${data.message}</div>`;
    if(data.errors&&data.errors.length) el.innerHTML+=data.errors.map(e=>`<p style="color:red;font-size:13px;">${e}</p>`).join('');
  }catch(e){alert(e.message);}
}
loadUsers();
</script>
</body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>My Registrations - Member</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; display: flex; min-height: 100vh; color: #1F2937; }
        
        /* Sidebar Styling */
        .sidebar { width: 250px; background-color: #0F172A; color: #9CA3AF; display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
        .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 24px; color: white; padding: 0 20px 20px; border-bottom: 1px solid #1E293B; margin-bottom: 20px; }
        .sidebar-brand span { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: normal; letter-spacing: 2px; margin-top: 4px; color: #64748B; text-transform: uppercase; }
        .sidebar-menu-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 20px 10px; color: #475569; }
        .sidebar-menu a { display: flex; align-items: center; padding: 12px 20px; color: #9CA3AF; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .sidebar-menu a:hover { color: white; }
        .sidebar-menu a.active { background-color: #10B981; color: white; font-weight: 500; border-radius: 4px; margin: 0 10px; padding: 12px 10px; width: calc(100% - 20px); }
        .sidebar-user { margin-top: auto; padding: 20px; border-top: 1px solid #1E293B; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #3B82F6; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .user-info { font-size: 14px; color: white; }
        .user-info span { display: block; font-size: 11px; color: #64748B; text-transform: uppercase; margin-top: 2px; }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: #111827; margin-bottom: 8px; }
        .header p { color: #6B7280; font-size: 14px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 16px; border: 1px solid #E5E7EB; background: white; border-radius: 6px; font-size: 14px; cursor: pointer; color: #4B5563; font-family: inherit; font-weight: 500; transition: all 0.2s; }
        .tab-btn.active { background: #10B981; color: white; border-color: #10B981; }
        .tab-btn:hover:not(.active) { background: #F9FAFB; }

        /* Table Area */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #F3F4F6; overflow: hidden; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9CA3AF; padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-weight: 500; white-space: nowrap; }
        td { padding: 16px 24px; border-bottom: 1px solid #F3F4F6; font-size: 14px; color: #374151; vertical-align: middle; }
        tr:hover { background-color: #F9FAFB; }
        
        .event-title { font-weight: 500; color: #111827; }
        .event-club { font-size: 12px; color: #6B7280; margin-top: 2px; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        
        .badge-registered { background-color: #DBEAFE; color: #1E40AF; }
        .badge-registered::before { background: #3B82F6; }
        .badge-attended { background-color: #D1FAE5; color: #065F46; }
        .badge-attended::before { background: #10B981; }
        .badge-cancelled { background-color: #FEE2E2; color: #991B1B; }
        .badge-cancelled::before { background: #EF4444; }

        .btn-cancel { padding: 6px 12px; background: white; border: 1px solid #FCA5A5; color: #DC2626; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-cancel:hover { background: #FEF2F2; }

    </style>
</head>
<body>
    <script src="/assets/js/api.js"></script>
    <script>requireLogin(); requireRole("member");</script>

    <div class="sidebar">
        <div class="sidebar-brand">
            ClubHub
            <span>Member Portal</span>
        </div>
        <div class="sidebar-menu-title">Explore</div>
        <div class="sidebar-menu">
            <a href="/views/member/dashboard.html">○ Dashboard</a>
            <a href="/views/member/events.html">● Browse Events</a>
            <a href="/views/member/clubs.html">◈ Browse Clubs</a>
        </div>
        <div class="sidebar-menu-title" style="margin-top: 20px;">My Activity</div>
        <div class="sidebar-menu">
            <a href="/views/member/registrations.html" class="active">◫ My Registrations</a>
            <a href="/views/member/notifications.html">⊙ Notifications</a>
        </div>
        <div class="sidebar-menu-title" style="margin-top: 20px;">Personal</div>
        <div class="sidebar-menu">
            <a href="/views/member/settings.html">⚙ Profile & Settings</a>
        </div>
        <div class="sidebar-user" id="sidebarUser"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>My Registrations</h1>
                <p>History of your event participations.</p>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
            <button class="tab-btn" onclick="setFilter('registered', this)">Registered (Upcoming)</button>
            <button class="tab-btn" onclick="setFilter('attended', this)">Attended</button>
            <button class="tab-btn" onclick="setFilter('cancelled', this)">Cancelled</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Registration Date</th>
                        <th>Event Name</th>
                        <th>Event Date & Time</th>
                        <th>Status</th>
                        <th style="text-align:right">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allRegs = [];
        let currentFilter = 'all';

        async function init() {
            const u = getUser();
            if(u) {
                const initials = u.full_name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
                document.getElementById('sidebarUser').innerHTML = `
                    <div class="avatar">${initials}</div>
                    <div class="user-info">${u.full_name}<span>Member</span></div>
                `;
                
                await loadData(u.id);
            }
        }

        async function loadData(userId) {
            try {
                const res = await apiCall(`/registration/mine?user_id=${userId}`);
                allRegs = res.data;
                // Sort by event start_time desc
                allRegs.sort((a,b) => new Date(b.start_time) - new Date(a.start_time));
                renderTable();
            } catch (e) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:red;">Error: ${e.message}</td></tr>`;
            }
        }

        function setFilter(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const filteredData = currentFilter === 'all' ? allRegs : allRegs.filter(d => d.registration_status === currentFilter);
            
            if(filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px 0; color: #9CA3AF;">No registrations found.</td></tr>';
                return;
            }

            let html = '';
            filteredData.forEach(item => {
                const regDate = new Date(item.registered_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                const d = new Date(item.start_time);
                const evDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit' });
                
                let badgeClass = 'badge-registered';
                if(item.registration_status === 'cancelled') badgeClass = 'badge-cancelled';
                if(item.registration_status === 'attended') badgeClass = 'badge-attended';

                // Can cancel if it's currently "registered" and event is not passed yet
                const canCancel = item.registration_status === 'registered' && (new Date() < new Date(item.start_time));

                html += `
                <tr>
                    <td style="color:#6B7280; font-family:monospace;">${regDate}</td>
                    <td>
                        <div class="event-title">${item.title}</div>
                        <div class="event-club">${item.club_name || 'General Event'}</div>
                    </td>
                    <td>${evDate}</td>
                    <td><span class="badge ${badgeClass}">${item.registration_status}</span></td>
                    <td style="text-align:right">
                        ${canCancel ? `<button class="btn-cancel" onclick="cancelReg(${item.registration_id}, ${item.event_id})">Cancel</button>` : `<span style="color:#D1D5DB; font-size:12px;">No Action</span>`}
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function cancelReg(regId, eventId) {
            if(!confirm('Are you sure you want to cancel this registration?')) return;
            try {
                await apiCall('/registration/cancel', 'POST', { registration_id: regId, event_id: eventId });
                alert('Successfully cancelled!');
                loadData(getUser().id);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        init();
    </script>
</body>
</html>
